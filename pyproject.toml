[project]
name = "xtreme-system"
version = "0.1.1"
description = "Dealership management system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.139.0",
    "fpdf2>=2.8.5",
    "jinja2>=3.1.6",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pypdf>=6.0.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "starlette>=1.3.1",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.50.2",
    "cryptography>=50.0.0",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "import-linter>=2.3",
    "mypy>=1.17.0",
    "polyfactory>=3.3.0",
    "polylith-cli>=1.48.3",
    "pre-commit>=4.2.0",
    "pylint>=4.0.6",
    "pytest>=8.4.0",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.8.0",
    "pytest-randomly>=3.16.0",
    "pytest-watch>=4.2.0",
    "pytest-xdist>=3.8.0",
    "result>=0.17",
    "ruff>=0.12.0",
    "vulture>=2.14",
    "xenon>=0.9.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["components", "bases", "development"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--ignore=tests/e2e",
]
testpaths = ["tests"]
markers = [
    "e2e: browser-based end-to-end tests (requires Playwright)",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["tests", "bases", "components", "development", "projects"]
exclude = ["skills-organized", "alembic"]

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "B",
    "C4",
    "DTZ",
    "E",
    "ERA",
    "F",
    "G",
    "I",
    "ICN",
    "N",
    "PIE",
    "PERF",
    "PL",
    "PT",
    "RET",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "T10",
    "T20",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "PLR0913",
    "TRY003",
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "PLR2004",
    "S101",
    "TRY003",
]
".claude/hooks/**/*.py" = [
    "S607",
    "T201",
]
".codex/hooks/**/*.py" = [
    "S607",
    "T201",
]
"development/**/*.py" = [
    "T201",
]

[tool.mypy]
python_version = "3.12"
files = ["bases", "components", "development", "tests"]
mypy_path = "bases:components"
namespace_packages = true
explicit_package_bases = true
strict = true
warn_unreachable = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.vulture]
paths = ["tests", "bases", "components", "development", "projects"]
min_confidence = 80
sort_by_size = true
ignore_names = [
    "model_config",
    "access_token",
    "token_type",
    "moto",
    "tipo",
    "modelo",
    "cor",
    "ano",
    "placa",
    "km",
    "preco",
    "procuracao",
]
ignore_decorators = ["app.*"]

[tool.deptry]
extend_exclude = [".opencode", ".agents", "alembic"]
known_first_party = ["xtreme_system"]
per_rule_ignores = { "DEP002" = ["alembic", "jinja2", "psycopg", "python-multipart", "uvicorn", "starlette"], "DEP003" = ["markupsafe"] }

[tool.xenon]
max-absolute = "B"
max-modules = "A"
max-average = "A"
exclude = ["tests"]

[tool.importlinter]
root_package = "xtreme_system"

[[tool.importlinter.contracts]]
name = "Components must not import from the API base layer"
type = "forbidden"
source_modules = ["xtreme_system"]
forbidden_modules = ["xtreme_system.api"]

[[tool.importlinter.contracts]]
name = "CRUD must not import upload-file"
type = "forbidden"
source_modules = ["xtreme_system.crud"]
forbidden_modules = ["xtreme_system.upload_file"]

[[tool.importlinter.contracts]]
name = "API layers"
type = "layers"
layers = [
    "xtreme_system.api.routes",
    "xtreme_system.api.crud_ui",
    "xtreme_system.api.deps",
]

[tool.coverage.run]
branch = true
source = ["xtreme_system"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/conftest.py",
]

[tool.coverage.report]
fail_under = 75
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
]
ignore_errors = false

[tool.polylith.bricks]
"bases/xtreme_system/api" = "xtreme_system/api"
"components/xtreme_system/documento_veiculo" = "xtreme_system/documento_veiculo"
"components/xtreme_system/empresa" = "xtreme_system/empresa"
"components/xtreme_system/veiculo" = "xtreme_system/veiculo"
"components/xtreme_system/whatsapp" = "xtreme_system/whatsapp"
"components/xtreme_system/rsd" = "xtreme_system/rsd"
"components/xtreme_system/imagem_veiculo" = "xtreme_system/imagem_veiculo"
"components/xtreme_system/compra" = "xtreme_system/compra"
"components/xtreme_system/imagem_comprovante_venda" = "xtreme_system/imagem_comprovante_venda"
"components/xtreme_system/cliente" = "xtreme_system/cliente"
"components/xtreme_system/documento_contrato_venda" = "xtreme_system/documento_contrato_venda"
"components/xtreme_system/custo_veiculo" = "xtreme_system/custo_veiculo"
"components/xtreme_system/fechamento_venda" = "xtreme_system/fechamento_venda"
"components/xtreme_system/investidor" = "xtreme_system/investidor"
"components/xtreme_system/database" = "xtreme_system/database"
"components/xtreme_system/usuario" = "xtreme_system/usuario"
"components/xtreme_system/crud" = "xtreme_system/crud"
"components/xtreme_system/caixa" = "xtreme_system/caixa"
"components/xtreme_system/auditoria" = "xtreme_system/auditoria"
"components/xtreme_system/imagem_comprovante_compra" = "xtreme_system/imagem_comprovante_compra"
"components/xtreme_system/venda" = "xtreme_system/venda"
"components/xtreme_system/perfil" = "xtreme_system/perfil"
"components/xtreme_system/imagem_documento_cliente" = "xtreme_system/imagem_documento_cliente"
"components/xtreme_system/auth" = "xtreme_system/auth"
"components/xtreme_system/documento_procuracao" = "xtreme_system/documento_procuracao"
"components/xtreme_system/exportacao" = "xtreme_system/exportacao"
"components/xtreme_system/logging" = "xtreme_system/logging"
"components/xtreme_system/workflow" = "xtreme_system/workflow"
