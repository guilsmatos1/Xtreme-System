[project]
name = "xtreme-system"
version = "0.1.0"
description = "Extreme system tooling and experiments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.139.0",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.50.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.17.0",
    "polylith-cli>=1.48.3",
    "pre-commit>=4.2.0",
    "pytest>=8.4.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=3.16.0",
    "pytest-watch>=4.2.0",
    "ruff>=0.12.0",
    "vulture>=2.14",
    "xenon>=0.9.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["components", "bases", "development", "src"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests", "bases", "components", "development", "projects"]
exclude = [".opencode/plugins/ponytail", "alembic"]

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "PL",
    "PT",
    "RET",
    "RUF",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "PLR2004",
    "S101",
]

[tool.mypy]
python_version = "3.12"
files = ["bases", "components"]
mypy_path = "bases:components"
namespace_packages = true
explicit_package_bases = true
strict = true
warn_unreachable = true
warn_unused_configs = true

[tool.vulture]
paths = ["src", "tests", "bases", "components", "development", "projects"]
min_confidence = 61
sort_by_size = true
ignore_names = [
    "model_config",
    "access_token",
    "token_type",
    "moto",
    "tipo",
    "modelo",
    "cor",
    "ano",
    "placa",
    "km",
    "preco",
    "procuracao",
]
ignore_decorators = ["app.*"]

[tool.xenon]
max-absolute = "B"
max-modules = "A"
max-average = "A"
exclude = ["tests"]
