name: Deploy to VPS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            export PATH="$HOME/.local/bin:$PATH"

            # Navigate to project directory
            cd ${{ secrets.DEPLOY_PATH }}

            echo "🔄 Pulling latest code..."
            git remote set-url origin "https://github.com/${{ github.repository }}.git"
            GIT_TERMINAL_PROMPT=0 git -c credential.helper= fetch --prune origin main
            git checkout main
            git reset --hard origin/main

            echo "📦 Installing dependencies..."
            uv sync

            echo "🗄️ Running database migrations..."
            uv run alembic upgrade heads

            echo "🔄 Restarting service..."
            sudo -n /bin/systemctl restart ${{ secrets.SERVICE_NAME }}
            systemctl is-active --quiet ${{ secrets.SERVICE_NAME }}

            echo "✅ Deployment completed successfully!"

      - name: Deployment notification
        if: success()
        run: |
          echo "✅ Deployment successful at $(date)"
          echo "Service: ${{ secrets.SERVICE_NAME }}"
          echo "Host: ${{ secrets.SSH_HOST }}"

      - name: Deployment failure notification
        if: failure()
        run: |
          echo "❌ Deployment failed at $(date)"
          exit 1
