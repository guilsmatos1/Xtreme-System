name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - run: make lint

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xtreme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - run: uv sync
      - name: Wait for PostgreSQL to accept connections
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres >/dev/null 2>&1; then
              echo "Postgres is ready"; break
            fi
            echo "Waiting for Postgres..."; sleep 1
          done
      - name: Run DB migrations
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/xtreme_test
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/xtreme_test
        run: uv run alembic upgrade head
      - name: Run tests against migrated Postgres
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/xtreme_test
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/xtreme_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: uv run pytest tests/ -q -n auto --cov=xtreme_system --cov-report=term-missing

  test-e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xtreme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run playwright install --with-deps chromium
      - name: Wait for PostgreSQL to accept connections
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres >/dev/null 2>&1; then
              echo "Postgres is ready"; break
            fi
            echo "Waiting for Postgres..."; sleep 1
          done
      - name: Run DB migrations
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/xtreme_test
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/xtreme_test
        run: uv run alembic upgrade head
      - name: Run e2e tests against migrated Postgres
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/xtreme_test
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/xtreme_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: make test-e2e-headless
