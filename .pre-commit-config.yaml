repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-fix
        name: ruff fix
        entry: uv run ruff check --fix
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff
        name: ruff
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format . --check
        language: system
        pass_filenames: false
        always_run: true

      - id: xenon
        name: xenon
        entry: uv run xenon src bases components development projects
        language: system
        pass_filenames: false
        always_run: true

      - id: alembic-check
        name: alembic check & migrate
        entry: bash -c 'uv run alembic check || (uv run alembic revision --autogenerate -m "auto_migration" && uv run alembic upgrade head && echo "Migration applied. Stage the new migration file before committing.")'
        language: system
        pass_filenames: false
        always_run: true

      - id: vulture
        name: vulture
        entry: uv run vulture
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true

      - id: deptry
        name: deptry
        entry: uv run deptry .
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: uv run python -m pytest tests/ -q
        language: system
        pass_filenames: false
        always_run: true

