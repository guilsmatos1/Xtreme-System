repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format . --check
        language: system
        pass_filenames: false
        always_run: true

      - id: xenon
        name: xenon
        entry: uv run xenon src bases components development projects
        language: system
        pass_filenames: false
        always_run: true

      - id: vulture
        name: vulture
        entry: uv run vulture
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: uv run python -m pytest tests/ -q
        language: system
        pass_filenames: false
        always_run: true
