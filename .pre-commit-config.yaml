repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-fix
        name: ruff fix
        entry: uv run ruff check --fix
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff
        name: ruff
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format . --check
        language: system
        pass_filenames: false
        always_run: true

      - id: pylint
        name: pylint
        entry: uv run pylint bases components development projects
        language: system
        pass_filenames: false
        always_run: true

      - id: xenon
        name: xenon
        entry: uv run xenon src bases components development projects
        language: system
        pass_filenames: false
        always_run: true

      - id: alembic-check
        name: alembic check
        entry: uv run alembic check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: alembic-chain
        name: alembic migration chain integrity
        entry: uv run python development/alembic_chain_check.py
        language: system
        pass_filenames: false
        always_run: true
        files: ^alembic/versions/.*\.py$

      - id: vulture
        name: vulture
        entry: uv run vulture
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true

      - id: deptry
        name: deptry
        entry: uv run deptry bases components development projects tests
        language: system
        pass_filenames: false
        always_run: true

      - id: polylith-check
        name: polylith check (warn on orphan bricks)
        entry: bash -c 'uv run poly check --no-verbose 2>&1 | grep -E "^(✔|🤔)" || true'
        language: system
        pass_filenames: false
        always_run: true

      - id: polylith-diff
        name: polylith diff (show impact)
        entry: bash -c 'uv run poly diff 2>&1 | grep -v "^fatal:" || echo "✔ No changes or fresh repo"'
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: env XTREME_ALLOW_SQLITE_TEST_DB=1 uv run python -m pytest tests/ -q -n 4
        language: system
        pass_filenames: false
        always_run: true

      #- id: test-ui
      #  name: test-ui
      #  entry: bash development/test-ui-pre-commit.sh
      #  language: system
      #  pass_filenames: false
      #  always_run: true
      #  require_serial: true
