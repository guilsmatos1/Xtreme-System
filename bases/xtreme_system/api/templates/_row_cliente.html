{% import "_macros.html" as ui %}
<tr id="cliente-{{ c.id }}">
  <td class="cell-strong">{{ c.nome }}</td>
  <td class="cell-mono">{{ c.documento }}</td>
  <td>{{ c.telefone or "-" }}</td>
  <td><span class="badge badge--plain">{{ c.tipo.value | replace("_", " ") | title }}</span></td>
  <td>{{ c.cidade or "-" }}</td>
  <td>{{ c.estado or "-" }}</td>
  {% if user.papel.value == 'admin' %}
  <td class="col-actions">
    <div class="row-actions">
      <button class="btn btn--ghost btn--sm" hx-get="/ui/clientes/{{ c.id }}/veiculos" hx-target="#modal" hx-swap="innerHTML" aria-label="Veículos de {{ c.nome }}">{{ ui.icon("vehicles") }}</button>
      <button class="btn btn--ghost btn--sm" hx-get="/ui/clientes/{{ c.id }}/documentos" hx-target="#modal" hx-swap="innerHTML" aria-label="Documentos de {{ c.nome }}">{{ ui.icon("file") }}</button>
      <button class="btn btn--ghost btn--sm" hx-get="/ui/clientes/{{ c.id }}/editar" hx-target="#modal" hx-swap="innerHTML" aria-label="Editar {{ c.nome }}">{{ ui.icon("edit") }}</button>
      <button class="btn btn--ghost btn--sm btn--danger" hx-post="/ui/clientes/{{ c.id }}/excluir" hx-target="#linhas" hx-swap="outerHTML" hx-confirm="Excluir o cliente {{ c.nome }}?" aria-label="Excluir {{ c.nome }}">{{ ui.icon("trash") }}</button>
    </div>
  </td>
  {% endif %}
</tr>
