{% import "_macros.html" as ui %}
<tr id="cliente-{{ c.id }}">
  <td class="cell-strong" data-col="nome">{{ c.nome }}</td>
  <td class="cell-mono" data-col="documento">{{ c.documento }}</td>
  <td data-col="telefone">{{ c.telefone or "-" }}</td>
  <td data-col="tipo"><span class="badge badge--plain">{{ c.tipo.value | replace("_", " ") | title }}</span></td>
  <td data-col="cidade">{{ c.cidade or "-" }}</td>
  <td data-col="estado">{{ c.estado or "-" }}</td>
  {% if is_admin(user) %}
  <td class="col-actions" data-col="acoes" data-col-fixed>
    <div class="row-actions">
      <button class="btn btn--ghost btn--sm" hx-get="{{ route_prefix or '/ui/clientes' }}/{{ c.id }}/veiculos" hx-target="#modal" hx-swap="innerHTML" aria-label="{{ vehicles_label or 'Veículos' }} de {{ c.nome }}">{{ ui.icon("vehicles") }}</button>
      <button class="btn btn--ghost btn--sm" hx-get="/ui/clientes/{{ c.id }}/documentos" hx-target="#modal" hx-swap="innerHTML" aria-label="Documentos de {{ c.nome }}">{{ ui.icon("file") }}</button>
      <button class="btn btn--ghost btn--sm" hx-get="{{ route_prefix or '/ui/clientes' }}/{{ c.id }}/editar" hx-target="#modal" hx-swap="innerHTML" aria-label="Editar {{ c.nome }}">{{ ui.icon("edit") }}</button>
      <button class="btn btn--ghost btn--sm btn--danger" hx-post="{{ route_prefix or '/ui/clientes' }}/{{ c.id }}/excluir" hx-target="#linhas" hx-swap="outerHTML" hx-confirm="Excluir o cliente {{ c.nome }}?" aria-label="Excluir {{ c.nome }}">{{ ui.icon("trash") }}</button>
    </div>
  </td>
  {% endif %}
</tr>
