{% import "_macros.html" as ui %}
<div class="modal" onclick="if(event.target===this)this.remove()">
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="mi-title">
    <div class="modal__head">
      <h3 id="mi-title">Novo Investimento</h3>
      <button class="icon-btn" type="button" aria-label="Fechar"
              onclick="document.getElementById('modal').innerHTML=''">{{ ui.icon("close") }}</button>
    </div>
    <form hx-post="/ui/investidores/investimentos/novo" hx-target="#modal" hx-swap="innerHTML">
      <div class="modal__body">
        {% if erro %}{{ ui.alert(erro) }}{% endif %}
        <div class="form-grid">
          <label class="field field--full">
            <span class="field__label">Investidor</span>
            <select class="select" name="investidor_id" required autofocus>
              {% for i in investidores %}<option value="{{ i.id }}">{{ i.nome }}</option>{% endfor %}
            </select>
          </label>
          <label class="field field--full">
            <span class="field__label">Valor investido (R$)</span>
            <input class="input" name="valor" type="number" step="0.01" min="0.01" required>
          </label>
        </div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--default" onclick="document.getElementById('modal').innerHTML=''">Cancelar</button>
        <button type="submit" class="btn btn--primary">{{ ui.icon("check") }} Salvar</button>
      </div>
    </form>
  </div>
</div>
