<form hx-post="/ui/usuarios/{{ usuario.id }}/perfil"
      hx-target="body"
      style="display:flex;align-items:flex-end;gap:var(--s-3);margin-top:var(--s-3);padding:var(--s-3);background:var(--surface-2);border-radius:var(--r)">
  <label class="field" style="margin:0;flex:1">
    <span class="field__label">Perfil para {{ usuario.username }}</span>
    <select class="select" name="perfil_id">
      <option value="">Nenhum</option>
      {% for p in perfis %}
      <option value="{{ p.id }}"{% if usuario.perfil_id == p.id %} selected{% endif %}>{{ p.nome }}</option>
      {% endfor %}
    </select>
  </label>
  <button class="btn btn--primary" type="submit">Salvar</button>
</form>
