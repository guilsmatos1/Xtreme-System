{% import "_macros.html" as ui %}
{% set dados = dados or {} %}
<div class="modal" onclick="if(event.target===this)closeModalOnBackdrop(this)">
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="mu-title">
    <div class="modal__head">
      <h3 id="mu-title">Novo usuário</h3>
      <button class="icon-btn" type="button" aria-label="Fechar"
              onclick="closeModalOnBackdrop(this.closest('.modal'))">{{ ui.icon("close") }}</button>
    </div>
    <form hx-post="/ui/usuarios" hx-target="#modal" hx-swap="innerHTML">
      <div class="modal__body">
        {% if erro %}{{ ui.alert(erro) }}{% endif %}
        <div class="form-grid">
          <label class="field">
            <span class="field__label">Usuário *</span>
            <input class="input" name="username" data-testid="usuario-form-username" value="{{ dados.get('username', '') }}" placeholder="nome.sobrenome" required autocomplete="off" autofocus>
          </label>
          <label class="field">
            <span class="field__label">Nome</span>
            <input class="input" name="nome" data-testid="usuario-form-nome" value="{{ dados.get('nome', '') or '' }}" autocomplete="off">
          </label>
          <label class="field">
            <span class="field__label">Senha *</span>
            <input class="input" name="senha" data-testid="usuario-form-senha" type="password" placeholder="••••••••" required autocomplete="new-password">
          </label>
          <label class="field">
            <span class="field__label">Papel</span>
            <select class="select" name="papel">
              <option value="funcionario"{% if dados.get('papel', 'funcionario') == 'funcionario' %} selected{% endif %}>Funcionário</option>
              <option value="admin"{% if dados.get('papel') == 'admin' %} selected{% endif %}>Admin</option>
            </select>
          </label>
          <label class="field">
            <span class="field__label">Perfil</span>
            <select class="select" name="perfil_id">
              <option value=""{% if not dados.get('perfil_id') %} selected{% endif %}>Nenhum</option>
              {% for p in perfis %}
              <option value="{{ p.id }}"{% if dados.get('perfil_id')|string == p.id|string %} selected{% endif %}>{{ p.nome }}</option>
              {% endfor %}
            </select>
          </label>
        </div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--default" onclick="closeModalOnBackdrop(this.closest('.modal'))">Cancelar</button>
        <button type="submit" class="btn btn--primary" data-testid="usuario-form-save">{{ ui.icon("plus") }} Criar usuário</button>
      </div>
    </form>
  </div>
</div>
