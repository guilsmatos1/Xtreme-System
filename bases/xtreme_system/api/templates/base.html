<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Xtreme Estoque{% endblock %}</title>
  <link rel="stylesheet" href="/static/pico.min.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <nav class="container">
    <ul><li><strong>Xtreme Estoque</strong></li></ul>
    <ul>
      <li><a href="/ui/veiculos">Veículos</a></li>
      <li><a href="/ui/investidores">Investidores</a></li>
      <li><a href="/ui/meios-captacao">Meios</a></li>
      {% if user.papel == 'admin' %}<li><a href="/ui/usuarios">Usuários</a></li>{% endif %}
      <li><form method="post" action="/ui/logout"><button class="secondary outline">Sair</button></form></li>
    </ul>
  </nav>
  <main class="container">
    <div id="msg" role="alert"></div>
    {% block content %}{% endblock %}
  </main>
  <div id="modal"></div>
</body>
</html>
