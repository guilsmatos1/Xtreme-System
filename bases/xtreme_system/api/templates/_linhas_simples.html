<tbody id="linhas"{% if oob %} hx-swap-oob="true"{% endif %}>
{% for item in itens %}
<tr id="item-{{ item.id }}">
  <td>{{ item.nome }}</td>
  {% if user.papel == 'admin' %}
  <td>
    <button class="outline" hx-get="{{ prefixo }}/{{ item.id }}/editar" hx-target="#modal" hx-swap="innerHTML">Editar</button>
    <button class="outline secondary" hx-post="{{ prefixo }}/{{ item.id }}/excluir" hx-target="#linhas" hx-swap="outerHTML" hx-confirm="Excluir {{ item.nome }}?">Excluir</button>
  </td>
  {% endif %}
</tr>
{% endfor %}
</tbody>
{% if msg %}<div id="msg" role="alert" hx-swap-oob="true"><small>{{ msg }}</small></div>{% endif %}
