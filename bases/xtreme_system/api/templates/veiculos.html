{% extends "base.html" %}
{% block titulo %}Veículos{% endblock %}
{% block content %}
<header style="display:flex;justify-content:space-between;align-items:center">
  <h2>Veículos</h2>
  {% if user.papel == 'admin' %}
  <button hx-get="/ui/veiculos/novo" hx-target="#modal" hx-swap="innerHTML">Novo veículo</button>
  {% endif %}
</header>
<input type="search" name="q"
       hx-get="/ui/veiculos"
       hx-trigger="keyup changed delay:300ms"
       hx-target="#linhas"
       hx-swap="outerHTML"
       placeholder="Buscar por modelo, placa ou cor..."
       value="{{ q or '' }}"
       aria-label="Buscar veículos">
<figure>
<table>
  <thead><tr>
    <th>Modelo</th><th>Placa</th><th>Tipo</th><th>Ano</th><th>KM</th>
    <th>Preço</th><th>Status</th><th>Investidor</th><th>Captação</th>
    {% if user.papel == 'admin' %}<th></th>{% endif %}
  </tr></thead>
  {% include "_linhas_veiculos.html" %}
</table>
</figure>
{% endblock %}
