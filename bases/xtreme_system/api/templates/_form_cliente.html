{% import "_macros.html" as ui %}
{% from "_form_campos_cliente.html" import campos_cliente %}
{% set dados = dados or {} %}
<div class="modal" x-on:click.self="fecharComConfirmacao()">
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="mc-title">
    <div class="modal__head">
      <h3 id="mc-title">{{ 'Editar cliente' if cliente else 'Novo cliente' }}</h3>
      <button class="icon-btn" type="button" aria-label="Fechar"
              x-on:click="fecharComConfirmacao()">{{ ui.icon("close") }}</button>
    </div>
    <form hx-post="{{ route_prefix or '/ui/clientes' }}{% if cliente %}/{{ cliente.id }}{% endif %}" hx-target="#modal" hx-swap="innerHTML">
      <div class="modal__body">
        {% if erro %}{{ ui.alert(erro) }}{% endif %}
        <div class="form-grid">
          {{ campos_cliente(dados, tipos, cliente=cliente) }}
        </div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--default" x-on:click="fecharComConfirmacao()">Cancelar</button>
        <button type="submit" class="btn btn--primary" data-testid="cliente-form-save">{{ ui.icon("check") }} Salvar</button>
      </div>
    </form>
  </div>
</div>
