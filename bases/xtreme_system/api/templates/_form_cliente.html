{% import "_macros.html" as ui %}
{% set dados = dados or {} %}
<div class="modal" x-on:click.self="fecharComConfirmacao()">
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="mc-title">
    <div class="modal__head">
      <h3 id="mc-title">{{ 'Editar cliente' if cliente else 'Novo cliente' }}</h3>
      <button class="icon-btn" type="button" aria-label="Fechar"
              x-on:click="fecharComConfirmacao()">{{ ui.icon("close") }}</button>
    </div>
    <form hx-post="{{ route_prefix or '/ui/clientes' }}{% if cliente %}/{{ cliente.id }}{% endif %}" hx-target="#modal" hx-swap="innerHTML">
      <div class="modal__body">
        {% if erro %}{{ ui.alert(erro) }}{% endif %}
        <div class="form-grid">
          <label class="field field--full">
            <span class="field__label">Nome *</span>
            <input class="input" name="nome" data-testid="cliente-form-name" value="{{ dados.get('nome', cliente.nome if cliente else '') }}" required autofocus>
          </label>

          <label class="field">
            <span class="field__label">Documento (CPF/CNPJ) *</span>
            <input class="input" name="documento" data-testid="cliente-form-document" value="{{ dados.get('documento', cliente.documento if cliente else '') }}" required>
          </label>
          <label class="field">
            <span class="field__label">Tipo *</span>
            <select class="select" name="tipo" data-testid="cliente-form-type" required>
              {% for t in tipos %}
              <option value="{{ t.value }}"{% if dados.get('tipo', cliente.tipo.value if cliente else '') == t.value %} selected{% endif %}>{{ t.value | replace("_", " ") | title }}</option>
              {% endfor %}
            </select>
          </label>

          <label class="field">
            <span class="field__label">Email</span>
            <input class="input" name="email" type="email" data-testid="cliente-form-email" value="{{ dados.get('email', cliente.email if cliente and cliente.email else '') or '' }}">
          </label>
          <label class="field">
            <span class="field__label">Telefone</span>
            <input class="input" name="telefone" data-testid="cliente-form-phone" value="{{ dados.get('telefone', cliente.telefone if cliente and cliente.telefone else '') or '' }}">
          </label>

          <label class="field field--full">
            <span class="field__label">Endereço</span>
            <input class="input" name="endereco" value="{{ dados.get('endereco', cliente.endereco if cliente and cliente.endereco else '') or '' }}">
          </label>

          <label class="field">
            <span class="field__label">Bairro</span>
            <input class="input" name="bairro" value="{{ dados.get('bairro', cliente.bairro if cliente and cliente.bairro else '') or '' }}">
          </label>
          <label class="field">
            <span class="field__label">CEP</span>
            <input class="input" name="cep" value="{{ dados.get('cep', cliente.cep if cliente and cliente.cep else '') or '' }}">
          </label>

          <label class="field">
            <span class="field__label">Cidade</span>
            <input class="input" name="cidade" value="{{ dados.get('cidade', cliente.cidade if cliente and cliente.cidade else '') or '' }}">
          </label>
          <label class="field">
            <span class="field__label">Estado</span>
            <input class="input" name="estado" maxlength="2" value="{{ dados.get('estado', cliente.estado if cliente and cliente.estado else '') or '' }}">
          </label>

          <label class="field field--full">
            <span class="field__label">Profissão</span>
            <input class="input" name="profissao" value="{{ dados.get('profissao', cliente.profissao if cliente and cliente.profissao else '') or '' }}">
          </label>
        </div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--default" x-on:click="fecharComConfirmacao()">Cancelar</button>
        <button type="submit" class="btn btn--primary" data-testid="cliente-form-save">{{ ui.icon("check") }} Salvar</button>
      </div>
    </form>
  </div>
</div>
