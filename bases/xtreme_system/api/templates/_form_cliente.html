{% import "_macros.html" as ui %}
<div class="modal" onclick="if(event.target===this)closeModalOnBackdrop(this)">
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="mc-title">
    <div class="modal__head">
      <h3 id="mc-title">{{ 'Editar cliente' if cliente else 'Novo cliente' }}</h3>
      <button class="icon-btn" type="button" aria-label="Fechar"
              onclick="closeModalOnBackdrop(this.closest('.modal'))">{{ ui.icon("close") }}</button>
    </div>
    <form hx-post="{{ route_prefix or '/ui/clientes' }}{% if cliente %}/{{ cliente.id }}{% endif %}" hx-target="#modal" hx-swap="innerHTML">
      <div class="modal__body">
        {% if erro %}{{ ui.alert(erro) }}{% endif %}
        <div class="form-grid">
          <label class="field field--full">
            <span class="field__label">Nome *</span>
            <input class="input" name="nome" value="{{ cliente.nome if cliente else '' }}" required autofocus>
          </label>

          <label class="field">
            <span class="field__label">Documento (CPF/CNPJ) *</span>
            <input class="input" name="documento" value="{{ cliente.documento if cliente else '' }}" required>
          </label>
          <label class="field">
            <span class="field__label">Tipo *</span>
            <select class="select" name="tipo" required>
              {% for t in tipos %}
              <option value="{{ t.value }}"{% if cliente and cliente.tipo == t %} selected{% endif %}>{{ t.value | replace("_", " ") | title }}</option>
              {% endfor %}
            </select>
          </label>

          <label class="field">
            <span class="field__label">Email</span>
            <input class="input" name="email" type="email" value="{{ cliente.email if cliente and cliente.email else '' }}">
          </label>
          <label class="field">
            <span class="field__label">Telefone</span>
            <input class="input" name="telefone" value="{{ cliente.telefone if cliente and cliente.telefone else '' }}">
          </label>

          <label class="field field--full">
            <span class="field__label">Endereço</span>
            <input class="input" name="endereco" value="{{ cliente.endereco if cliente and cliente.endereco else '' }}">
          </label>

          <label class="field">
            <span class="field__label">Bairro</span>
            <input class="input" name="bairro" value="{{ cliente.bairro if cliente and cliente.bairro else '' }}">
          </label>
          <label class="field">
            <span class="field__label">CEP</span>
            <input class="input" name="cep" value="{{ cliente.cep if cliente and cliente.cep else '' }}">
          </label>

          <label class="field">
            <span class="field__label">Cidade</span>
            <input class="input" name="cidade" value="{{ cliente.cidade if cliente and cliente.cidade else '' }}">
          </label>
          <label class="field">
            <span class="field__label">Estado</span>
            <input class="input" name="estado" maxlength="2" value="{{ cliente.estado if cliente and cliente.estado else '' }}">
          </label>

          <label class="field field--full">
            <span class="field__label">Profissão</span>
            <input class="input" name="profissao" value="{{ cliente.profissao if cliente and cliente.profissao else '' }}">
          </label>
        </div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--default" onclick="closeModalOnBackdrop(this.closest('.modal'))">Cancelar</button>
        <button type="submit" class="btn btn--primary">{{ ui.icon("check") }} Salvar</button>
      </div>
    </form>
  </div>
</div>
