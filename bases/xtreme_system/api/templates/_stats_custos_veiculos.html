{% import "_macros.html" as ui %}
<section id="stats-custos-veiculos" class="stats" aria-label="Resumo de custos"{% if oob %} hx-swap-oob="outerHTML"{% endif %}>
  <article class="card stat stat--accent">
    <div class="stat__label">{{ ui.icon("cash") }} Total de custos</div>
    <div class="stat__value cell-num">{{ ui.moeda(total_custos) }}</div>
    <div class="stat__hint">custos visíveis</div>
  </article>
  <article class="card stat stat--success">
    <div class="stat__label">{{ ui.icon("tag") }} Lançamentos</div>
    <div class="stat__value cell-num">{{ quantidade_custos }}</div>
    <div class="stat__hint">registros visíveis</div>
  </article>
</section>
