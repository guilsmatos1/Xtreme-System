{% import "_macros.html" as ui %}
{% set dados = dados or {} %}
<div class="modal" x-on:click.self="fecharComConfirmacao()">
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="mcv-title">
    <div class="modal__head">
      <h3 id="mcv-title">{{ 'Editar custo' if custo else 'Novo custo' }}</h3>
      <button class="icon-btn" type="button" aria-label="Fechar"
              x-on:click="fecharComConfirmacao()">{{ ui.icon("close") }}</button>
    </div>
    <form hx-post="/ui/custos-veiculos{% if custo %}/{{ custo.id }}{% endif %}" hx-target="#modal" hx-swap="innerHTML"
          hx-sync="this:drop" hx-disabled-elt="find button[type='submit']">
      <div class="modal__body">
        {% if erro %}{{ ui.alert(erro) }}{% endif %}
        <div class="form-grid">
          <label class="field">
            <span class="field__label">Veículo *</span>
            <select class="select" name="veiculo_id" data-testid="custo-veiculo-form-vehicle" required>
              <option value="">Selecione</option>
              {% for veic in veiculos %}
              <option value="{{ veic.id }}"{% if dados.get('veiculo_id', custo.veiculo_id if custo else '')|string == veic.id|string %} selected{% endif %}>{{ veic.placa }} · {{ veic.modelo }}</option>
              {% endfor %}
            </select>
          </label>
          <label class="field">
            <span class="field__label">Categoria *</span>
            <input class="input" name="categoria" data-testid="custo-veiculo-form-category" list="categorias-custo" value="{{ dados.get('categoria', custo.categoria if custo else '') }}" required>
            {% if not custo %}
            <datalist id="categorias-custo">
              <option value="Documentação">
              <option value="Manutenção">
              <option value="Mecânica">
              <option value="Peças">
              <option value="Lavagem">
              <option value="Combustível">
              <option value="Transporte">
              <option value="Outros">
            </datalist>
            {% endif %}
          </label>
          <label class="field">
            <span class="field__label">Data *</span>
          <input class="input" name="data_custo" type="date" value="{{ dados.get('data_custo', custo.data_custo.isoformat() if custo and custo.data_custo else hoje.isoformat()) }}" required>
          </label>
          {% if not custo or pode_ver_campo(user, 'custos-veiculos', 'valor') %}
          <label class="field">
            <span class="field__label">Valor *</span>
            <input class="input" name="valor" data-testid="custo-veiculo-form-value" type="text" inputmode="decimal" value="{{ dados.get('valor', custo.valor if custo else '') }}" required>
          </label>
          {% endif %}
          <label class="field field--full">
            <span class="field__label">Descrição</span>
            <textarea class="input" name="descricao" rows="4">{{ dados.get('descricao', custo.descricao if custo and custo.descricao else '') or '' }}</textarea>
          </label>
        </div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--default" x-on:click="fecharComConfirmacao()">Cancelar</button>
        <button type="submit" class="btn btn--primary" data-testid="custo-veiculo-form-save">{{ ui.icon("check") }} Salvar</button>
      </div>
    </form>
  </div>
</div>
