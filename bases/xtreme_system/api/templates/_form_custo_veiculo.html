{% import "_macros.html" as ui %}
<div class="modal" onclick="if(event.target===this)this.remove()">
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="mcv-title">
    <div class="modal__head">
      <h3 id="mcv-title">{{ 'Editar custo' if custo else 'Novo custo' }}</h3>
      <button class="icon-btn" type="button" aria-label="Fechar"
              onclick="document.getElementById('modal').innerHTML=''">{{ ui.icon("close") }}</button>
    </div>
    <form hx-post="/ui/custos-veiculos{% if custo %}/{{ custo.id }}{% endif %}" hx-target="#modal" hx-swap="innerHTML">
      <div class="modal__body">
        {% if erro %}{{ ui.alert(erro) }}{% endif %}
        <div class="form-grid">
          <label class="field">
            <span class="field__label">Veículo</span>
            <select class="select" name="veiculo_id" required>
              <option value="">Selecione</option>
              {% for veic in veiculos %}
              <option value="{{ veic.id }}"{% if custo and custo.veiculo_id == veic.id %} selected{% endif %}>{{ veic.placa }} · {{ veic.modelo }}</option>
              {% endfor %}
            </select>
          </label>
          <label class="field">
            <span class="field__label">Categoria</span>
            <input class="input" name="categoria" value="{{ custo.categoria if custo else '' }}" required>
          </label>
          <label class="field">
            <span class="field__label">Data</span>
            <input class="input" name="data_custo" type="date" value="{{ custo.data_custo.isoformat() if custo and custo.data_custo else hoje.isoformat() }}" required>
          </label>
          {% if not custo or pode_ver_campo(user, 'custos-veiculos', 'valor') %}
          <label class="field">
            <span class="field__label">Valor</span>
            <input class="input" name="valor" type="number" step="0.01" min="0.01" value="{{ custo.valor if custo else '' }}" required>
          </label>
          {% endif %}
          <label class="field field--full">
            <span class="field__label">Descrição</span>
            <textarea class="input" name="descricao" rows="4">{{ custo.descricao if custo and custo.descricao else '' }}</textarea>
          </label>
        </div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--default" onclick="document.getElementById('modal').innerHTML=''">Cancelar</button>
        <button type="submit" class="btn btn--primary">{{ ui.icon("check") }} Salvar</button>
      </div>
    </form>
  </div>
</div>
