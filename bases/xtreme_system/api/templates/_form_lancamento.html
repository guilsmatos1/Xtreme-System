{% import "_macros.html" as ui %}
{% set dados = dados or {} %}
<div class="modal" onclick="if(event.target===this)closeModalOnBackdrop(this)">
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="ml-title">
    <div class="modal__head">
      <h3 id="ml-title">{{ 'Editar lançamento' if lancamento else 'Novo lançamento' }}</h3>
      <button class="icon-btn" type="button" aria-label="Fechar"
              onclick="closeModalOnBackdrop(this.closest('.modal'))">{{ ui.icon("close") }}</button>
    </div>
    <form hx-post="/ui/investidores/{{ investidor_id }}/lancamentos{% if lancamento %}/{{ lancamento.id }}{% endif %}" hx-target="#modal" hx-swap="innerHTML"
          hx-sync="this:drop" hx-disabled-elt="find button[type='submit']">
      <div class="modal__body">
        {% if erro %}{{ ui.alert(erro) }}{% endif %}
        <div class="form-grid">
          <label class="field">
            <span class="field__label">Tipo</span>
            <select class="select" name="tipo" data-testid="lancamento-form-tipo" required>
  {% for t in tipos %}<option value="{{ t.value }}"{% if dados.get('tipo', lancamento.tipo.value if lancamento else '') == t.value %} selected{% endif %}>{{ 'Aporte' if t.value == 'aporte' else 'Saque' }}</option>{% endfor %}
            </select>
          </label>
          <label class="field">
            <span class="field__label">Valor (R$)</span>
            <input class="input" name="valor" data-testid="lancamento-form-valor" type="text" inputmode="decimal" value="{{ dados.get('valor', lancamento.valor if lancamento else '') }}" required>
          </label>
          <label class="field field--full">
            <span class="field__label">Descrição</span>
  <input class="input" name="descricao" data-testid="lancamento-form-descricao" value="{{ dados.get('descricao', lancamento.descricao if lancamento else '') or '' }}" autofocus>
          </label>
        </div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--default" onclick="closeModalOnBackdrop(this.closest('.modal'))">Cancelar</button>
        <button type="submit" class="btn btn--primary" data-testid="lancamento-form-save">{{ ui.icon("check") }} Salvar</button>
      </div>
    </form>
  </div>
</div>
