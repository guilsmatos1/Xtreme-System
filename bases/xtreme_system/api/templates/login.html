<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Xtreme Estoque</title>
  <link rel="stylesheet" href="/static/pico.min.css">
</head>
<body>
<main class="container">
  <article style="max-width:24rem;margin:4rem auto">
    <header><strong>Xtreme Estoque</strong></header>
    {% if erro %}<p style="color:var(--pico-del-color)">{{ erro }}</p>{% endif %}
    <form method="post" action="/ui/login">
      <input name="username" placeholder="Usuário" required autofocus>
      <input name="password" type="password" placeholder="Senha" required>
      <button type="submit">Entrar</button>
    </form>
  </article>
</main>
</body>
</html>
