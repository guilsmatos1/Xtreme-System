{% import "_macros.html" as ui %}
<div class="modal" onclick="if(event.target===this)this.remove()">
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="mp-title">
    <div class="modal__head">
      <h3 id="mp-title">{{ 'Editar perfil' if perfil else 'Novo perfil' }}</h3>
      <button class="icon-btn" type="button" aria-label="Fechar"
              onclick="document.getElementById('modal').innerHTML=''">{{ ui.icon("close") }}</button>
    </div>
    <form hx-post="/ui/perfis{% if perfil %}/{{ perfil.id }}{% endif %}" hx-target="#modal" hx-swap="innerHTML">
      <div class="modal__body">
        {% if erro %}{{ ui.alert(erro) }}{% endif %}
        <div class="form-grid">
          <label class="field field--full">
            <span class="field__label">Nome</span>
            <input class="input" name="nome" value="{{ perfil.nome if perfil else '' }}" required autofocus>
          </label>
        </div>
        <div class="field field--full" style="margin-top:var(--s-4)">
          <span class="field__label">Páginas com acesso</span>
          <div class="stack" style="gap:var(--s-2);margin-top:var(--s-2)">
            {% for chave, label in paginas_disponiveis %}
            <label style="display:flex;align-items:center;gap:var(--s-2)">
              <input type="checkbox" name="paginas" value="{{ chave }}"
                     {% if perfil and chave in perfil.paginas %}checked{% endif %}>
              {{ label }}
            </label>
            {% endfor %}
          </div>
        </div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--default" onclick="document.getElementById('modal').innerHTML=''">Cancelar</button>
        <button type="submit" class="btn btn--primary">{{ ui.icon("check") }} Salvar</button>
      </div>
    </form>
  </div>
</div>
