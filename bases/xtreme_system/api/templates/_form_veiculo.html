<dialog open>
<article>
  <header><strong>{{ 'Editar' if veiculo else 'Novo' }} veículo</strong></header>
  {% if erro %}<p style="color:var(--pico-del-color)">{{ erro }}</p>{% endif %}
  <form hx-post="/ui/veiculos{% if veiculo %}/{{ veiculo.id }}{% endif %}" hx-target="#modal" hx-swap="innerHTML">
    <label>Tipo
      <select name="tipo" required>
        {% for t in tipos %}<option value="{{ t.value }}"{% if veiculo and veiculo.tipo == t %} selected{% endif %}>{{ t.value }}</option>{% endfor %}
      </select>
    </label>
    <label>Modelo <input name="modelo" value="{{ veiculo.modelo if veiculo else '' }}" required></label>
    <label>Cor <input name="cor" value="{{ veiculo.cor if veiculo else '' }}" required></label>
    <label>Ano <input name="ano" type="number" value="{{ veiculo.ano if veiculo else '' }}" required></label>
    <label>Placa <input name="placa" value="{{ veiculo.placa if veiculo else '' }}" required></label>
    <label>KM <input name="km" type="number" value="{{ veiculo.km if veiculo else '' }}" required></label>
    <label>Preço <input name="preco" type="number" step="0.01" value="{{ veiculo.preco if veiculo else '' }}" required></label>
    <label>Procuração <input name="procuracao" value="{{ (veiculo.procuracao or '') if veiculo else '' }}"></label>
    <label>Status
      <select name="status" required>
        {% for s in status %}<option value="{{ s.value }}"{% if veiculo and veiculo.status == s %} selected{% endif %}>{{ s.value }}</option>{% endfor %}
      </select>
    </label>
    <label>Investidor
      <select name="investidor_id" required>
        {% for i in investidores %}<option value="{{ i.id }}"{% if veiculo and veiculo.investidor_id == i.id %} selected{% endif %}>{{ i.nome }}</option>{% endfor %}
      </select>
    </label>
    <label>Meio de captação
      <select name="meio_captacao_id" required>
        {% for m in meios %}<option value="{{ m.id }}"{% if veiculo and veiculo.meio_captacao_id == m.id %} selected{% endif %}>{{ m.nome }}</option>{% endfor %}
      </select>
    </label>
    <footer>
      <button type="button" class="secondary" onclick="document.getElementById('modal').innerHTML=''">Cancelar</button>
      <button type="submit">Salvar</button>
    </footer>
  </form>
</article>
</dialog>
