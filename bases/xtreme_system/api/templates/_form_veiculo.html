{% import "_macros.html" as ui %}
<div class="modal" onclick="if(event.target===this)this.remove()">
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="mv-title">
    <div class="modal__head">
      <h3 id="mv-title">{{ 'Editar veículo' if veiculo else 'Novo veículo' }}</h3>
      <button class="icon-btn" type="button" aria-label="Fechar"
              onclick="document.getElementById('modal').innerHTML=''">{{ ui.icon("close") }}</button>
    </div>
    <form hx-post="/ui/veiculos{% if veiculo %}/{{ veiculo.id }}{% endif %}" hx-target="#modal" hx-swap="innerHTML"
          {% if not veiculo %}hx-encoding="multipart/form-data"{% endif %}>
      <div class="modal__body">
        {% if erro %}{{ ui.alert(erro) }}{% endif %}
        <div class="form-grid">
          <label class="field">
            <span class="field__label">Tipo</span>
            <select class="select" name="tipo" required>
              {% for t in tipos %}<option value="{{ t.value }}"{% if veiculo and veiculo.tipo == t %} selected{% endif %}>{{ t.value | capitalize }}</option>{% endfor %}
            </select>
          </label>
          <label class="field">
            <span class="field__label">Status</span>
            <select class="select" name="status" required>
              {% for s in status %}<option value="{{ s.value }}"{% if veiculo and veiculo.status == s %} selected{% endif %}>{{ s.value | capitalize }}</option>{% endfor %}
            </select>
          </label>

          <label class="field field--full">
            <span class="field__label">Modelo</span>
            <input class="input" name="modelo" value="{{ veiculo.modelo if veiculo else '' }}" required autofocus>
          </label>

          <label class="field">
            <span class="field__label">Cor</span>
            <input class="input" name="cor" value="{{ veiculo.cor if veiculo else '' }}" required>
          </label>
          <label class="field">
            <span class="field__label">Ano</span>
            <input class="input" name="ano" type="number" value="{{ veiculo.ano if veiculo else '' }}" required>
          </label>

          <label class="field">
            <span class="field__label">Placa</span>
            <input class="input" name="placa" value="{{ veiculo.placa if veiculo else '' }}" required style="text-transform:uppercase">
          </label>
          <label class="field">
            <span class="field__label">Quilometragem</span>
            <input class="input" name="km" type="number" value="{{ veiculo.km if veiculo else '' }}" required>
          </label>

          <label class="field">
            <span class="field__label">Preço (R$)</span>
            <input class="input" name="preco" type="number" step="0.01" value="{{ veiculo.preco if veiculo else '' }}" required>
          </label>
          <label class="field">
            <span class="field__label">Procuração <span class="muted">(opcional)</span></span>
            <input class="input" name="procuracao" value="{{ (veiculo.procuracao or '') if veiculo else '' }}">
          </label>

          <label class="field">
            <span class="field__label">Investidor</span>
            <select class="select" name="investidor_id" required>
              {% for i in investidores %}<option value="{{ i.id }}"{% if veiculo and veiculo.investidor_id == i.id %} selected{% endif %}>{{ i.nome }}</option>{% endfor %}
            </select>
          </label>
          <label class="field">
            <span class="field__label">Meio de captação</span>
            <select class="select" name="meio_captacao_id" required>
              {% for m in meios %}<option value="{{ m.id }}"{% if veiculo and veiculo.meio_captacao_id == m.id %} selected{% endif %}>{{ m.nome }}</option>{% endfor %}
            </select>
          </label>
        </div>
        {% if not veiculo %}
        <div class="form-grid">
          <label class="field">
            <span class="field__label">Fotos <span class="muted">(opcional)</span></span>
            <input class="input" type="file" name="imagens" multiple accept="image/*">
          </label>
          <label class="field">
            <span class="field__label">Documentos <span class="muted">(opcional)</span></span>
            <input class="input" type="file" name="documentos" multiple>
          </label>
        </div>
        {% endif %}
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--default" onclick="document.getElementById('modal').innerHTML=''">Cancelar</button>
        <button type="submit" class="btn btn--primary">{{ ui.icon("check") }} Salvar</button>
      </div>
    </form>
    {% if veiculo %}
    <div class="modal__body" style="padding-top:0">
      {% include "_midia_veiculo.html" %}
    </div>
    {% endif %}
  </div>
</div>
