{% import "_macros.html" as ui %}
<div class="modal" onclick="if(event.target===this)closeModalOnBackdrop(this)">
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="ms-title">
    <div class="modal__head">
      <h3 id="ms-title">{{ 'Editar' if item else 'Novo' }} — {{ titulo }}</h3>
      <button class="icon-btn" type="button" aria-label="Fechar"
              onclick="document.getElementById('modal').innerHTML=''">{{ ui.icon("close") }}</button>
    </div>
    <form hx-post="{{ prefixo }}{% if item %}/{{ item.id }}{% endif %}" hx-target="#modal" hx-swap="innerHTML">
      <div class="modal__body">
        {% if erro %}{{ ui.alert(erro) }}{% endif %}
        <label class="field">
          <span class="field__label">Nome *</span>
          <input class="input" name="nome" value="{{ item.nome if item else '' }}" required autofocus>
        </label>
        {% if not item and prefixo == '/ui/investidores' %}
        <label class="field">
          <span class="field__label">Valor Investido</span>
          <input class="input" name="valor_investido" type="number" step="0.01" min="0" placeholder="0,00">
        </label>
        {% endif %}
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--default" onclick="document.getElementById('modal').innerHTML=''">Cancelar</button>
        <button type="submit" class="btn btn--primary">{{ ui.icon("check") }} Salvar</button>
      </div>
    </form>
  </div>
</div>
