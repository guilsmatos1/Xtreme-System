{% import "_macros.html" as ui %}
<div class="modal" x-on:click.self="fecharComConfirmacao()">
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="ms-title">
    <div class="modal__head">
      <h3 id="ms-title">{{ 'Editar' if item else 'Novo' }} — {{ titulo }}</h3>
      <button class="icon-btn" type="button" aria-label="Fechar"
              x-on:click="fecharComConfirmacao()">{{ ui.icon("close") }}</button>
    </div>
    <form hx-post="{{ prefixo }}{% if item %}/{{ item.id }}{% endif %}" hx-target="#modal" hx-swap="innerHTML"
          hx-sync="this:drop" hx-disabled-elt="find button[type='submit']">
      <div class="modal__body">
        {% if erro %}{{ ui.alert(erro) }}{% endif %}
        <label class="field">
          <span class="field__label">Nome *</span>
          <input class="input" name="nome" data-testid="simples-form-nome" value="{{ item.nome if item else '' }}" required autofocus>
        </label>
        {% if not item and prefixo == '/ui/investidores' %}
        <label class="field">
          <span class="field__label">Valor Investido</span>
          <input class="input" name="valor_investido" data-testid="simples-form-valor-investido" type="text" inputmode="decimal" placeholder="0,00">
        </label>
        {% endif %}
        {% if prefixo == '/ui/investidores' %}
        <label style="display:flex;align-items:center;gap:var(--s-2);margin-top:var(--s-3)">
          <input type="checkbox" name="notificar_telegram" value="1"
                 data-testid="simples-form-notificar-telegram"
                 {% if item and item.notificar_telegram %}checked{% endif %}>
          Notificar vendas no Telegram
        </label>
        {% endif %}
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--default" x-on:click="fecharComConfirmacao()">Cancelar</button>
        <button type="submit" class="btn btn--primary" data-testid="simples-form-save">{{ ui.icon("check") }} Salvar</button>
      </div>
    </form>
  </div>
</div>
