<dialog open>
<article>
  <header><strong>{{ 'Editar' if item else 'Novo' }} — {{ titulo }}</strong></header>
  {% if erro %}<p style="color:var(--pico-del-color)">{{ erro }}</p>{% endif %}
  <form hx-post="{{ prefixo }}{% if item %}/{{ item.id }}{% endif %}" hx-target="#modal" hx-swap="innerHTML">
    <label>Nome <input name="nome" value="{{ item.nome if item else '' }}" required></label>
    <footer>
      <button type="button" class="secondary" onclick="document.getElementById('modal').innerHTML=''">Cancelar</button>
      <button type="submit">Salvar</button>
    </footer>
  </form>
</article>
</dialog>
